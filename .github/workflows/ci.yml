name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: websaude
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d websaude"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/websaude
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/websaude
      ELASTICSEARCH_NODE: http://localhost:9200
      CORS_ORIGINS: http://localhost:5173
      THROTTLE_TTL_MS: '60000'
      THROTTLE_LIMIT: '1000'
      SWAGGER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
