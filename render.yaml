services:
  - type: web
    name: web-saude-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SWAGGER_ENABLED
        value: 'true'
      - key: THROTTLE_TTL_MS
        value: '60000'
      - key: THROTTLE_LIMIT
        value: '100'
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,http://localhost:4200
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # ROLLOUT: defina FRONTEND_PROXY_SECRET (>= 32 caracteres) no painel do Render ANTES de
      # mergear/deployar: com NODE_ENV=production a API nao sobe sem ele.
      - key: FRONTEND_PROXY_SECRET
        sync: false
      - key: ELASTICSEARCH_NODE
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
