<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
  <title id="title">Autenticação JWT da Web Saúde API</title>
  <rect width="1200" height="360" fill="#f4fbf8"/>
  <text x="40" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Autenticação</text>
  <text x="40" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b">Access token ~15 min. Refresh 7 dias, rotacionado e revogável.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="114" width="240" height="180" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="160" cy="168" r="26" fill="#ccfbf1"/>
    <rect x="148" y="156" width="24" height="18" rx="3" fill="#0f766e"/>
    <circle cx="160" cy="162" r="4" fill="#ccfbf1"/>
    <text x="160" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Login</text>
    <text x="160" y="244" text-anchor="middle" font-size="12" fill="#64748b">POST /auth/login</text>
  </g>
  <path d="M292 204h36" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <path d="M318 196l14 8-14 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="340" y="114" width="240" height="180" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="460" cy="168" r="26" fill="#ccfbf1"/>
    <rect x="446" y="156" width="28" height="18" rx="3" fill="#0f766e"/>
    <circle cx="468" cy="165" r="3" fill="#fff"/>
    <text x="460" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">JWT</text>
    <text x="460" y="244" text-anchor="middle" font-size="12" fill="#64748b">access + refresh</text>
  </g>
  <path d="M592 204h36" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <path d="M618 196l14 8-14 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="640" y="114" width="240" height="180" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="760" cy="168" r="26" fill="#ccfbf1"/>
    <rect x="748" y="154" width="24" height="28" rx="4" fill="#0f766e"/>
    <circle cx="760" cy="168" r="4" fill="#ccfbf1"/>
    <text x="760" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Authorize</text>
    <text x="760" y="244" text-anchor="middle" font-size="12" fill="#64748b">Bearer no cadeado</text>
  </g>
  <path d="M892 204h36" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <path d="M918 196l14 8-14 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="920" y="114" width="240" height="180" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="1040" cy="168" r="26" fill="#ccfbf1"/>
    <path d="M1028 168a12 12 0 1 1 8 11" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <path d="M1044 172l8-1-3 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <text x="1040" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Refresh</text>
    <text x="1040" y="244" text-anchor="middle" font-size="12" fill="#64748b">POST /auth/refresh</text>
  </g>
</svg>
