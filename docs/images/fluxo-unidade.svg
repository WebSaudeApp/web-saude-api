<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title">
  <title id="title">Fluxo de aprovação da unidade de saúde</title>
  <rect width="1200" height="420" fill="#f4fbf8"/>
  <text x="40" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Fluxo da unidade</text>
  <text x="40" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b">O gestor envia. O admin aprova ou rejeita. Só aprovada e ativa entra na busca pública.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="120" width="230" height="150" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="60" y="140" width="190" height="14" rx="7" fill="#ccfbf1"/>
    <rect x="60" y="164" width="150" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="60" y="184" width="120" height="10" rx="5" fill="#e2e8f0"/>
    <text x="155" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Rascunho</text>
    <text x="155" y="254" text-anchor="middle" font-size="12" fill="#64748b">DRAFT / INACTIVE</text>
  </g>
  <path d="M282 195h48" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <path d="M320 187l14 8-14 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <text x="306" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#0f766e" font-weight="700">submit</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="346" y="120" width="230" height="150" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="461" cy="172" r="22" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <path d="M461 160v16" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <circle cx="461" cy="184" r="2" fill="#d97706"/>
    <text x="461" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Pendente</text>
    <text x="461" y="254" text-anchor="middle" font-size="12" fill="#64748b">PENDING</text>
  </g>
  <path d="M588 175h48" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <path d="M626 167l14 8-14 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <text x="612" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#0f766e" font-weight="700">aprovar</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="652" y="120" width="230" height="150" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="767" cy="172" r="22" fill="#ecfdf5"/>
    <path d="M757 172l7 7 14-16" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <text x="767" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Aprovada</text>
    <text x="767" y="254" text-anchor="middle" font-size="12" fill="#64748b">APPROVED + ACTIVE</text>
  </g>

  <path d="M461 270v28" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <path d="M453 288l8 14 8-14" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <text x="478" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#d97706" font-weight="700">rejeitar</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="346" y="318" width="230" height="72" rx="16" fill="#fff" stroke="#fde68a"/>
    <text x="461" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Rejeitada</text>
    <text x="461" y="370" text-anchor="middle" font-size="12" fill="#64748b">REJECTED · volta a rascunho</text>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="930" y="120" width="230" height="150" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="1045" cy="172" r="22" fill="#ccfbf1"/>
    <circle cx="1045" cy="172" r="8" fill="none" stroke="#0f766e" stroke-width="3"/>
    <text x="1045" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Busca pública</text>
    <text x="1045" y="254" text-anchor="middle" font-size="12" fill="#64748b">GET /health-units</text>
  </g>
  <path d="M882 195h36" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <path d="M908 187l14 8-14 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
</svg>
