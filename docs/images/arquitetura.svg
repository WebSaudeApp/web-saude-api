<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura da Web Saúde API</title>
  <desc id="desc">Frontend chama a API NestJS, que persiste dados no PostgreSQL via Prisma.</desc>
  <rect width="1200" height="420" fill="#f4fbf8"/>
  <text x="60" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Arquitetura</text>
  <text x="60" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b">O frontend nunca acessa o banco. Toda regra passa pela API.</text>

  <rect x="60" y="130" width="280" height="200" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <rect x="84" y="156" width="232" height="88" rx="10" fill="#ccfbf1"/>
  <rect x="102" y="172" width="80" height="10" rx="5" fill="#0f766e"/>
  <rect x="102" y="192" width="196" height="8" rx="4" fill="#99f6e4"/>
  <rect x="102" y="210" width="150" height="8" rx="4" fill="#99f6e4"/>
  <text x="200" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Frontend</text>
  <text x="200" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">web-saude-interface</text>

  <path d="M354 230h52" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <path d="M396 222l14 8-14 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="460" y="130" width="280" height="200" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <rect x="548" y="156" width="104" height="72" rx="12" fill="#0f766e"/>
  <text x="600" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">API</text>
  <text x="600" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">NestJS + JWT</text>
  <text x="600" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">regras, permissões, validação</text>

  <path d="M754 230h52" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <path d="M796 222l14 8-14 8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="860" y="130" width="280" height="200" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <ellipse cx="1000" cy="178" rx="46" ry="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <rect x="954" y="178" width="92" height="40" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <ellipse cx="1000" cy="218" rx="46" ry="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1000" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <text x="1000" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Prisma + Supabase</text>
</svg>
